server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: marketlink-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/marketlink_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: MarketLinkHikariCP

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Application specific configurations
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

  mandi-api:
    url: ${MANDI_API_URL:https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070}
    api-key: ${MANDI_API_KEY:mock-key}
    sync-cron: "0 0 6 * * ?" # Run daily at 6:00 AM

  transport:
    base-cost: 300.0
    cost-per-km: 20.0
    quintal-divisor: 10.0

  recommendation:
    weights:
      price: 0.40
      net-return: 0.35
      distance: 0.10
      trend: 0.10
      demand: 0.05

  matching:
    weights:
      crop: 0.30
      quantity: 0.20
      distance: 0.15
      price: 0.20
      date: 0.10
      quality: 0.05

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
